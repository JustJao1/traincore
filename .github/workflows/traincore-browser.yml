name: Traincore browser regression
on:
  push:
    branches: ['redesign/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node tests/static.cjs
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 > /tmp/traincore-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: traincore-browser-captures
          path: test-results/
          if-no-files-found: ignore
